[project]
name = "procurement-backend"
version = "0.1.0"
description = "企业采购审批系统 —— 后端（个人学习项目）"
requires-python = ">=3.12"

# 依赖用 requirements.txt 管（pip freeze 的结果），这里只放工具配置。
# 保持单一事实来源：装了新包就 `pip freeze > requirements.txt`。

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 应用里的引擎是模块级单例，连接池绑定在"创建它时的事件循环"上。
# 若每个测试各建一个循环，第二个用例起就会报 RuntimeError: Event loop is closed。
# 所以整个测试会话共用一个循环。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: 纯函数测试，不连数据库（默认档，毫秒级）",
    "integration: 需要 PostgreSQL 与迁移的测试",
]
# 默认只跑毫秒级的纯函数测试，于是 `pytest` 这个最常敲的命令永远秒回。
# 跑全量：pytest -m ""   只跑集成：pytest -m integration
#
# ============================ 关于 `tmp_path` 落在仓库里 ============================
# **本机实测**：这个受限沙箱里 `tempfile.gettempdir()` 返回的是**当前工作目录**
# （TEMP/TMP 都指向 %LOCALAPPDATA%\Temp 且可写，Python 仍然不用它们），
# 于是 pytest 的 `tmp_path` 会落在 `backend/pytest-of-<用户>/` ——
# 一跑测试就在仓库里多出一棵临时目录树（里面是空目录，删掉无影响）。
#
# 试过在这里写 `--basetemp=${TEMP}/…`：**pytest 不展开 `${TEMP}`**，
# 会把那个字面量当路径建出来（`FileNotFoundError`，实测 29 个用例全 ERROR），
# 所以配置这条路走不通。真正兜底的是 `.gitignore` 里的 `pytest-of-*/`：
# 脏文件不进版本库，要清就删那一棵目录。
addopts = "-m unit"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长交给 formatter

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
